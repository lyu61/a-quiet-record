nd that makes me happy in a way I don't think I can fully explain.","I know we won't always get everything right. We're still learning how to love each other, how to understand each other, and how to make someone feel loved even when words and distance get in the way. But I want to keep learning with you. I want us to grow, not into perfect people, but into people who understand each other a little better every day.","For your new year, I hope you find more reasons to be happy, more courage to pursue the things you love, and more moments when you feel genuinely at home in your own life. I hope you never stop becoming yourself.","And selfishly, I hope I get to witness a lot of it.","Thank you for being here, Renly. Thank you for being the person you are, and for letting me be part of your life. Of all the things that could have happened, I'm so glad our paths crossed.","There's still so much of life we haven't experienced together. So many songs left to hear, so many places left to see, so many ordinary days waiting for us.","I don't know what they'll bring, but I'm looking forward to finding out with you.","Happy birthday, my love.","I love you, and I'm so happy that somewhere in this big, unpredictable world, I found you."],signature:"Always yours",from:"Chloe ♡",ps:""},Yg={edition:"Birthday Edition"},Gg=[{id:"just-us",title:"Just Us",artist:"for Renly",note:"the whole world on mute for a minute",src:"./songs/just-us.m4a",duration:178.8,palette:"ember",seed:21,memoryId:"mem-1"},{id:"a-language-of-our-own",title:"A Language of Our Own",artist:"for Renly",note:"the words only the two of us use",src:"./songs/a-language-of-our-own.m4a",duration:315.6,palette:"emerald",seed:33,memoryId:"mem-3"},{id:"time-will-tell",title:"Time Will Tell",artist:"for Renly",note:"patience, which you taught me",src:"./songs/time-will-tell.m4a",duration:229.2,palette:"twilight",seed:44,memoryId:"mem-2"},{id:"you",title:"YOU",artist:"for Renly",note:"the one I would play if you asked me wha
